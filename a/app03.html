<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹캠 손가락 꼬집기 젠가 - Finger Pinch Jenga</title>
  <!-- Matter.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats {
      display: flex;
      gap: 20px;
    }
    .stat-box {
      background: rgba(255,255,255,0.05);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
    }
    .stat-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; }
    .stat-val { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; }

    #main-container {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    .webcam-preview {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 180px;
      height: 135px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      background: #1e293b;
      z-index: 5;
    }
    #webcam-video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #hand-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      transform: scaleX(-1);
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-secondary { background: rgba(255,255,255,0.1); color: #cbd5e1; }
    .btn-secondary:hover { background: rgba(255,255,255,0.2); }

    .instructions-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      z-index: 5;
      max-width: 280px;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #cbd5e1;
    }
    .instructions-overlay h4 { color: #38bdf8; margin-bottom: 6px; }

    #pinch-indicator {
      position: absolute;
      pointer-events: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      background: rgba(56, 189, 248, 0.3);
      transform: translate(-50%, -50%);
      z-index: 6;
      transition: width 0.1s, height 0.1s, background 0.1s;
      display: none;
    }
    #pinch-indicator.active {
      width: 32px;
      height: 32px;
      background: rgba(239, 68, 68, 0.7);
      border-color: #ef4444;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>🤏</span> 웹캠 손가락 꼬집기 젠가
    </div>
    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">현재 높이</div>
        <div class="stat-val" id="current-height">0 cm</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">쌓은 블록</div>
        <div class="stat-val" id="stacked-count">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">최고 기록</div>
        <div class="stat-val" id="high-score">0 cm</div>
      </div>
    </div>
  </header>

  <div id="main-container">
    <canvas id="game-canvas"></canvas>

    <div class="instructions-overlay">
      <h4>💡 게임 방법</h4>
      <p>1. 엄지와 검지로 <b>꼬집기 동작</b>을 하면 블록을 집습니다.</p>
      <p>2. 원하는 위치로 이동 후 손가락을 펴면 블록이 떨어집니다.</p>
      <p>3. 바닥 플랫폼 위에 차곡차곡 높이 쌓아보세요!</p>
      <p style="margin-top: 6px; font-size: 0.75rem; color: #94a3b8;">* 웹캠 미사용 시 마우스 클릭&드래그로도 가능합니다.</p>
    </div>

    <div class="webcam-preview">
      <video id="webcam-video" autoplay playsinline muted></video>
      <canvas id="hand-canvas"></canvas>
    </div>

    <div id="pinch-indicator"></div>

    <div class="controls">
      <button class="btn" id="btn-spawn">새 블록 생성</button>
      <button class="btn btn-secondary" id="btn-reset">초기화</button>
      <button class="btn btn-secondary" id="btn-audio">🔊 소리 켜기</button>
    </div>
  </div>

  <script>
    // Audio Synth
    let audioCtx = null;
    let audioMuted = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(freq, duration, type = 'sine') {
      if (audioMuted || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Canvas & Matter.js Setup
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    
    let width = window.innerWidth;
    let height = window.innerHeight - 60;
    canvas.width = width;
    canvas.height = height;

    const Engine = Matter.Engine,
          World = Matter.World,
          Bodies = Matter.Bodies,
          Body = Matter.Body,
          Composite = Matter.Composite;

    const engine = Engine.create();
    engine.gravity.y = 1.0;

    // Platform Base
    const platformWidth = 260;
    const platformHeight = 30;
    const platformX = width / 2;
    const platformY = height - 100;

    const ground = Bodies.rectangle(platformX, platformY, platformWidth, platformHeight, {
      isStatic: true,
      render: { fillStyle: '#334155' },
      friction: 0.9
    });

    const floor = Bodies.rectangle(width / 2, height + 50, width * 2, 100, {
      isStatic: true
    });

    World.add(engine.world, [ground, floor]);

    // Game Variables
    let blocks = [];
    let grabbedBlock = null;
    let pinchPos = { x: width / 2, y: height / 2 };
    let isPinching = false;
    
    let highScore = parseInt(localStorage.getItem('jenga_high_score') || '0');
    document.getElementById('high-score').textContent = `${highScore} cm`;

    // Pinch Indicator DOM
    const pinchIndicator = document.getElementById('pinch-indicator');

    // Block Spawning
    const BLOCK_W = 100;
    const BLOCK_H = 26;

    function spawnBlock(x = width / 2, y = 150) {
      const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
      const color = colors[Math.floor(Math.random() * colors.length)];
      
      const block = Bodies.rectangle(x, y, BLOCK_W, BLOCK_H, {
        restitution: 0.1,
        friction: 0.8,
        density: 0.005,
        render: { fillStyle: color }
      });
      block.customColor = color;
      
      blocks.push(block);
      World.add(engine.world, block);
      playSound(440, 0.1);
      return block;
    }

    // Spawn initial block
    spawnBlock();

    // Resize listener
    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight - 60;
      canvas.width = width;
      canvas.height = height;
      Body.setPosition(ground, { x: width / 2, y: height - 100 });
    });

    // Pinch Logic
    function updatePinchState(pinched, x, y) {
      // Lerp smooth position
      pinchPos.x += (x - pinchPos.x) * 0.4;
      pinchPos.y += (y - pinchPos.y) * 0.4;

      pinchIndicator.style.display = 'block';
      pinchIndicator.style.left = `${pinchPos.x}px`;
      pinchIndicator.style.top = `${pinchPos.y + 60}px`;

      if (pinched && !isPinching) {
        // Start pinch
        isPinching = true;
        pinchIndicator.classList.add('active');
        
        // Find block near pinch position
        for (let b of blocks) {
          const dx = b.position.x - pinchPos.x;
          const dy = b.position.y - pinchPos.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 60) {
            grabbedBlock = b;
            Body.setVelocity(grabbedBlock, { x: 0, y: 0 });
            Body.setAngularVelocity(grabbedBlock, 0);
            playSound(600, 0.15, 'triangle');
            break;
          }
        }
      } else if (!pinched && isPinching) {
        // Release pinch
        isPinching = false;
        pinchIndicator.classList.remove('active');
        if (grabbedBlock) {
          playSound(300, 0.1, 'sine');
          grabbedBlock = null;
        }
      }

      // Drag block
      if (isPinching && grabbedBlock) {
        Body.setPosition(grabbedBlock, { x: pinchPos.x, y: pinchPos.y });
        Body.setVelocity(grabbedBlock, { x: 0, y: 0 });
        Body.setAngularVelocity(grabbedBlock, 0);
      }
    }

    // Mouse Fallback
    let mouseIsDown = false;
    canvas.addEventListener('mousedown', (e) => {
      initAudio();
      mouseIsDown = true;
      updatePinchState(true, e.clientX, e.clientY - 60);
    });
    canvas.addEventListener('mousemove', (e) => {
      if (mouseIsDown) {
        updatePinchState(true, e.clientX, e.clientY - 60);
      }
    });
    canvas.addEventListener('mouseup', () => {
      mouseIsDown = false;
      updatePinchState(false, pinchPos.x, pinchPos.y);
    });

    // Button Controls
    document.getElementById('btn-spawn').addEventListener('click', () => {
      initAudio();
      spawnBlock();
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      initAudio();
      blocks.forEach(b => World.remove(engine.world, b));
      blocks = [];
      spawnBlock();
    });

    document.getElementById('btn-audio').addEventListener('click', (e) => {
      initAudio();
      audioMuted = !audioMuted;
      e.target.textContent = audioMuted ? '🔊 소리 켜기' : '🔇 소리 끄기';
    });

    // Score Calculation
    function updateScore() {
      let maxY = platformY;
      let stackedCount = 0;

      blocks.forEach(b => {
        if (Math.abs(b.position.x - platformX) < platformWidth / 2 + 50 && b.position.y < platformY) {
          if (b.position.y < maxY) {
            maxY = b.position.y;
          }
          stackedCount++;
        }
      });

      const heightPx = Math.max(0, platformY - (platformHeight / 2) - maxY);
      const heightCm = Math.round(heightPx / 10);

      document.getElementById('current-height').textContent = `${heightCm} cm`;
      document.getElementById('stacked-count').textContent = stackedCount;

      if (heightCm > highScore) {
        highScore = heightCm;
        localStorage.setItem('jenga_high_score', highScore);
        document.getElementById('high-score').textContent = `${highScore} cm`;
      }

      return maxY;
    }

    // Main Game Loop
    function gameLoop() {
      Engine.update(engine, 1000 / 60);

      ctx.clearRect(0, 0, width, height);

      // Render Ground Platform
      ctx.fillStyle = '#334155';
      ctx.fillRect(platformX - platformWidth / 2, platformY - platformHeight / 2, platformWidth, platformHeight);
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.strokeRect(platformX - platformWidth / 2, platformY - platformHeight / 2, platformWidth, platformHeight);

      // Render Blocks
      blocks.forEach(b => {
        ctx.save();
        ctx.translate(b.position.x, b.position.y);
        ctx.rotate(b.angle);

        ctx.fillStyle = b.customColor || '#f59e0b';
        ctx.fillRect(-BLOCK_W / 2, -BLOCK_H / 2, BLOCK_W, BLOCK_H);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 2;
        ctx.strokeRect(-BLOCK_W / 2, -BLOCK_H / 2, BLOCK_W, BLOCK_H);

        // Highlight grabbed block
        if (b === grabbedBlock) {
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 3;
          ctx.strokeRect(-BLOCK_W / 2 - 2, -BLOCK_H / 2 - 2, BLOCK_W + 4, BLOCK_H + 4);
        }

        ctx.restore();
      });

      // Render Peak Score Line
      const peakY = updateScore();
      if (peakY < platformY - 10) {
        ctx.save();
        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, peakY);
        ctx.lineTo(width, peakY);
        ctx.stroke();

        ctx.fillStyle = '#38bdf8';
        ctx.font = '12px sans-serif';
        ctx.fillText(`TOP PEAK`, 20, peakY - 6);
        ctx.restore();
      }

      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);

    // MediaPipe Hands Integration
    const videoElement = document.getElementById('webcam-video');
    const handCanvas = document.getElementById('hand-canvas');
    const handCtx = handCanvas.getContext('2d');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      handCanvas.width = videoElement.videoWidth || 180;
      handCanvas.height = videoElement.videoHeight || 135;
      handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Draw hand skeleton on preview
        drawConnectors(handCtx, landmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 2 });
        drawLandmarks(handCtx, landmarks, { color: '#FF0000', lineWidth: 1, radius: 3 });

        // Thumb Tip (4) & Index Tip (8)
        const thumb = landmarks[4];
        const index = landmarks[8];

        // Distance in normalized coordinates
        const dx = thumb.x - index.x;
        const dy = thumb.y - index.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // Pinch threshold
        const pinched = dist < 0.08;

        // Convert index coordinate to screen space (mirrored X)
        const screenX = (1 - index.x) * width;
        const screenY = index.y * height;

        updatePinchState(pinched, screenX, screenY);
      } else {
        if (isPinching) {
          updatePinchState(false, pinchPos.x, pinchPos.y);
        }
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 320,
      height: 240
    });

    camera.start().catch(err => {
      console.warn("Webcam camera access failed, fallback to mouse controls.", err);
    });
  </script>
</body>
</html>
