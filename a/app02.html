<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>얼굴로 피하기 게임</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  #wrap { max-width: 1100px; margin: 0 auto; padding: 12px; }
  canvas { width: 100%; border-radius: 12px; background: #000; display: block; }
  #bar { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  button { padding: 10px 18px; font-size: 16px; border: 0; border-radius: 8px; background: #4f8cff; color: #fff; cursor: pointer; }
  button:disabled { background: #555; cursor: default; }
  #status { font-size: 14px; color: #aaa; }
  video { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <button id="start">카메라 시작</button>
    <button id="mute" style="background:#666">소리 끄기</button>
    <span id="status">버튼을 누르고 카메라 권한을 허용하세요.</span>
  </div>
  <canvas id="c" width="1280" height="720"></canvas>
  <p style="font-size:13px;color:#888">얼굴(초록색 상자)이 떨어지는 물건에 닿으면 목숨이 줄어듭니다. 몸을 좌우로 움직여 피하세요. 게임이 끝나면 화면을 클릭하거나 스페이스바를 누르면 다시 시작합니다.</p>
</div>
<video id="v" playsinline></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/face_detection.js"></script>
<script>
const W = 1280, H = 720;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const video = document.getElementById('v');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');

// ----- 게임 상태 -----
const ITEMS = [
  { shape: 'circle',   color: '#ff1744' },   // 진한 빨강
  { shape: 'square',   color: '#ff6d00' },   // 진한 주황
  { shape: 'triangle', color: '#ffd600' },   // 진한 노랑
  { shape: 'star',     color: '#d500f9' },   // 진한 보라
  { shape: 'diamond',  color: '#00e5ff' },   // 진한 하늘색
  { shape: 'hexagon',  color: '#76ff03' }    // 진한 연두
];
const SPEED_UP_PER_SEC = 0.05;  // 1초마다 속도가 5%p씩 증가 (기본 속도 대비)
const MAX_SPEED_MUL = 4;        // 속도 상한 (기본 속도의 4배)
let state = 'ready';      // ready | playing | over
let objs = [], lives, score, best = 0, startTime, lastSpawn, invincibleUntil;
let face = null;          // {x, y, w, h} (캔버스 좌표, 거울 반영)
let faceSeenAt = 0;

// ----- 소리 (WebAudio) -----
let audio = null, master = null, beatStep = 0, nextBeat = 0;
const PENTA = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50]; // 도 레 미 솔 라 높은도

function tone(freq, dur, type, vol, slideTo) {
  if (!audio) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator(), g = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g).connect(master);
  osc.start(t); osc.stop(t + dur + 0.02);
}

function noise(dur, vol, hp) {
  if (!audio) return;
  const len = Math.floor(audio.sampleRate * dur);
  const buf = audio.createBuffer(1, len, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = audio.createBufferSource(), g = audio.createGain(), f = audio.createBiquadFilter();
  src.buffer = buf;
  f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(vol, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
  src.connect(f).connect(g).connect(master);
  src.start();
}

// 맞았을 때: 쿵 + 파직 + "끼야아악~" 하고 떨리며 내려가는 죽는 소리
function playHit() {
  if (!audio) return;
  noise(0.2, 0.4, 300);
  tone(220, 0.15, 'sine', 0.5, 60);
  const t = audio.currentTime, dur = 0.9;
  const osc = audio.createOscillator(), g = audio.createGain(), lp = audio.createBiquadFilter();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(750, t);
  osc.frequency.exponentialRampToValueAtTime(70, t + dur);
  // 목소리가 떨리는 느낌(비브라토)
  const lfo = audio.createOscillator(), lfoGain = audio.createGain();
  lfo.frequency.value = 14; lfoGain.gain.value = 35;
  lfo.connect(lfoGain).connect(osc.frequency);
  lp.type = 'lowpass'; lp.frequency.value = 1400;
  g.gain.setValueAtTime(0.35, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(lp).connect(g).connect(master);
  osc.start(t); lfo.start(t);
  osc.stop(t + dur + 0.02); lfo.stop(t + dur + 0.02);
}
// 게임 오버: 죽는 소리가 끝난 뒤 슬프게 내려가는 4음
function playOver() {
  [392, 330, 262, 196].forEach((f, i) => {
    setTimeout(() => tone(f, i === 3 ? 0.7 : 0.22, 'square', 0.12), 700 + i * 230);
  });
}
function playDodge() { tone(1400, 0.07, 'square', 0.05); }                              // 피했을 때: 짧은 틱

// 8비트 리듬(킥·스네어·하이햇). 속도가 빨라지면 템포도 빨라짐
function runBeat(now, speedMul) {
  if (!audio) return;
  if (!nextBeat) nextBeat = now;
  if (now < nextBeat) return;
  const bpm = 100 + (speedMul - 1) * 25;
  nextBeat += 60000 / bpm / 2;
  if (nextBeat < now) nextBeat = now;
  const s = beatStep++ % 8;
  if (s % 4 === 0) tone(150, 0.15, 'sine', 0.5, 45);      // 킥
  else if (s % 4 === 2) noise(0.1, 0.18, 1500);           // 스네어
  if (s % 2 === 1) noise(0.04, 0.12, 7000);               // 하이햇
}

function resetGame() {
  objs = []; lives = 3; score = 0; nextBeat = 0; beatStep = 0;
  startTime = performance.now(); lastSpawn = startTime; invincibleUntil = 0;
  state = 'playing';
}

function spawn(now) {
  const elapsed = (now - startTime) / 1000;
  const interval = Math.max(250, 900 - elapsed * 18);   // 시간이 지날수록 더 자주
  if (now - lastSpawn < interval) return;
  lastSpawn = now;
  const size = 40 + Math.random() * 30;
  const idx = Math.floor(Math.random() * ITEMS.length);
  tone(PENTA[idx], 0.3, 'triangle', 0.15, PENTA[idx] * 0.7);   // 도형마다 다른 음, 떨어지는 느낌의 하강음
  // 절반은 얼굴 근처를 노려서 떨어뜨림
  const tx = face && Math.random() < 0.5 ? face.x + (Math.random() - 0.5) * face.w * 2 : Math.random() * W;
  objs.push({
    x: Math.min(W - size, Math.max(size, tx)), y: -size, size,
    vy: 220 + Math.random() * 120,                     // 기본 속도 (px/초)
    type: ITEMS[idx],
    rot: 0, vr: (Math.random() - 0.5) * 4
  });
}

function update(dt, now) {
  if (state !== 'playing') return;
  spawn(now);
  // 시간이 지날수록 모든 물건(이미 떨어지는 것 포함)이 점점 더 빨라짐
  const elapsed = (now - startTime) / 1000;
  const speedMul = Math.min(MAX_SPEED_MUL, 1 + elapsed * SPEED_UP_PER_SEC);
  for (const o of objs) { o.y += o.vy * speedMul * dt; o.rot += o.vr * speedMul * dt; }
  runBeat(now, speedMul);

  // 충돌 (얼굴 상자를 약간 줄여서 판정)
  if (face && now > invincibleUntil) {
    const fx = face.x, fy = face.y, rx = face.w * 0.4, ry = face.h * 0.45;
    for (const o of objs) {
      const r = o.size * 0.4;
      const dx = (o.x - fx) / (rx + r), dy = (o.y - fy) / (ry + r);
      if (dx * dx + dy * dy < 1) {
        o.hit = true;
        lives--;
        invincibleUntil = now + 1000;
        playHit();
        if (lives <= 0) { state = 'over'; best = Math.max(best, score); playOver(); }
        break;
      }
    }
  }
  // 피한 물건은 점수, 화면 밖/맞은 물건은 제거
  objs = objs.filter(o => {
    if (o.hit) return false;
    if (o.y > H + o.size) { score += 10; playDodge(); return false; }
    return true;
  });
}

// ----- 그리기 -----
function shapePath(shape, r) {
  ctx.beginPath();
  const poly = (n, rot) => {
    for (let i = 0; i < n; i++) {
      const a = rot + i * Math.PI * 2 / n;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  };
  if (shape === 'circle') ctx.arc(0, 0, r, 0, Math.PI * 2);
  else if (shape === 'square') ctx.rect(-r * 0.85, -r * 0.85, r * 1.7, r * 1.7);
  else if (shape === 'triangle') poly(3, -Math.PI / 2);
  else if (shape === 'diamond') poly(4, 0);
  else if (shape === 'hexagon') poly(6, 0);
  else if (shape === 'star') {
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.5 : r * 1.1;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  }
}

function drawShape(shape, r, color) {
  // 빛나는 글로우 + 진한 단색 채우기
  ctx.shadowColor = color;
  ctx.shadowBlur = 25;
  ctx.fillStyle = color;
  shapePath(shape, r);
  ctx.fill();
  ctx.shadowBlur = 0;
  // 굵은 검정 외곽선
  ctx.lineWidth = 6;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#000';
  shapePath(shape, r);
  ctx.stroke();
  // 안쪽 흰 테두리로 입체감
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  shapePath(shape, r * 0.78);
  ctx.stroke();
}

function draw(image, now) {
  ctx.save();
  ctx.translate(W, 0); ctx.scale(-1, 1);       // 거울 모드
  ctx.drawImage(image, 0, 0, W, H);
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, W, H);

  // 얼굴 상자
  if (face) {
    const blink = now < invincibleUntil && Math.floor(now / 100) % 2;
    ctx.strokeStyle = blink ? '#ff4d6d' : '#2dff9a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(face.x, face.y, face.w * 0.4, face.h * 0.45, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 물건
  for (const o of objs) {
    ctx.save();
    ctx.translate(o.x, o.y); ctx.rotate(o.rot);
    drawShape(o.type.shape, o.size * 0.55, o.type.color);
    ctx.restore();
  }

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 30px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('점수 ' + score + '   최고 ' + best, 24, 44);
  ctx.textAlign = 'right';
  ctx.fillText('❤️'.repeat(Math.max(0, lives)), W - 24, 44);

  ctx.textAlign = 'center';
  if (!face && state !== 'over') {
    ctx.fillStyle = '#ffd166'; ctx.font = 'bold 36px sans-serif';
    ctx.fillText('얼굴이 인식되지 않아요', W / 2, H / 2);
  } else if (state === 'ready') {
    ctx.fillStyle = '#fff'; ctx.font = 'bold 44px sans-serif';
    ctx.fillText('클릭하거나 스페이스바를 눌러 시작', W / 2, H / 2);
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, H / 2 - 100, W, 200);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 56px sans-serif';
    ctx.fillText('게임 오버  ·  점수 ' + score, W / 2, H / 2 - 20);
    ctx.font = '28px sans-serif';
    ctx.fillText('클릭하거나 스페이스바를 눌러 다시 시작', W / 2, H / 2 + 40);
  }
}

// ----- 입력 -----
function tryStart() { if (state !== 'playing') resetGame(); }
canvas.addEventListener('click', tryStart);
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); tryStart(); } });

// ----- 얼굴 인식 결과 처리 + 게임 루프 -----
let lastT = performance.now();
function onResults(results) {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  const d = results.detections && results.detections[0];
  if (d) {
    const b = d.boundingBox;
    const target = { x: (1 - b.xCenter) * W, y: b.yCenter * H, w: b.width * W, h: b.height * H };
    // 떨림 줄이기: 이전 값과 부드럽게 섞기
    face = face ? {
      x: face.x * 0.5 + target.x * 0.5, y: face.y * 0.5 + target.y * 0.5,
      w: face.w * 0.7 + target.w * 0.3, h: face.h * 0.7 + target.h * 0.3
    } : target;
    faceSeenAt = now;
  } else if (now - faceSeenAt > 400) {
    face = null;
  }

  update(dt, now);
  draw(results.image, now);
  statusEl.textContent = face ? '얼굴 인식 중' : '얼굴을 찾는 중...';
}

const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => {
  if (!master) return;
  const off = master.gain.value > 0;
  master.gain.value = off ? 0 : 0.6;
  muteBtn.textContent = off ? '소리 켜기' : '소리 끄기';
});

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  // 소리는 사용자 클릭 직후에 만들어야 브라우저가 허용함
  audio = new (window.AudioContext || window.webkitAudioContext)();
  master = audio.createGain();
  master.gain.value = 0.6;
  master.connect(audio.destination);
  audio.resume();
  statusEl.textContent = '모델 불러오는 중...';
  const fd = new FaceDetection({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection@0.4.1646425229/${f}`
  });
  fd.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
  fd.onResults(onResults);

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: W, height: H, facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    statusEl.textContent = '카메라를 사용할 수 없습니다: ' + e.message;
    startBtn.disabled = false;
    return;
  }
  (async function loop() {
    if (video.readyState >= 2) await fd.send({ image: video });
    requestAnimationFrame(loop);
  })();
});
</script>
</body>
</html>
